<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browse Products | FarmConnect</title>

    <link rel="stylesheet" href="../../buyer.css">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="buyer-sidebar">

        <div class="buyer-logo">
            🌾
            <div>
                <strong>FarmConnect</strong>
                <span>Buyer Portal</span>
            </div>
        </div>

        <nav class="buyer-menu">

            <a href="dashboard.html" class="buyer-menu-item">
                🏠
                <span>Dashboard</span>
            </a>

            <a href="products.html" class="buyer-menu-item active">
                📦
                <span>Browse Products</span>
            </a>

            <a href="#" class="buyer-menu-item">
                ❤️
                <span>Favorites</span>
            </a>

            <a href="cart.html" class="buyer-menu-item">
                🛒
                <span>My Cart</span>
            </a>

            <a href="#" class="buyer-menu-item">
                📋
                <span>My Orders</span>
            </a>

            <a href="#" class="buyer-menu-item">
                👤
                <span>My Profile</span>
            </a>

        </nav>

        <div class="buyer-logout">

            <a href="../../index.html" class="buyer-menu-item">
                🚪
                <span>Logout</span>
            </a>

        </div>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="buyer-main">

        <!-- HEADER -->

        <header class="buyer-header">

            <div>
                <h1>Browse Products</h1>

                <p>
                    Discover fresh agricultural products directly
                    from farmers.
                </p>
            </div>

            <a href="cart.html" class="cart-button">
                🛒 My Cart
            </a>

        </header>


        <!-- SEARCH -->

        <section class="buyer-search-section">

            <input
                type="text"
                id="productSearch"
                placeholder="🔍 Search products..."
            >

            <select id="categoryFilter">

                <option value="all">
                    All Categories
                </option>

                <option value="Vegetables">
                    🥕 Vegetables
                </option>

                <option value="Fruits">
                    🍎 Fruits
                </option>

                <option value="Grains">
                    🌾 Grains
                </option>

                <option value="Pulses">
                    🫘 Pulses
                </option>

                <option value="Spices">
                    🌶️ Spices
                </option>

                <option value="Other">
                    📦 Other
                </option>

            </select>

        </section>


        <!-- PRODUCT COUNT -->

        <div class="products-heading">

            <div>
                <h2>Fresh Products</h2>

                <p>
                    <span id="productCount">0</span>
                    products available
                </p>
            </div>

        </div>


        <!-- PRODUCTS -->

        <section
            id="buyerProductsContainer"
            class="buyer-products-grid">

        </section>


    </main>


    <script src="../../buyer.js"></script>

</body>

</html>
