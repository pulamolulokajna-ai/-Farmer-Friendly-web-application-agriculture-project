<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product | FarmConnect</title>

    <link rel="stylesheet" href="../../dashboard.css">

</head>


<body>


    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="logo">
            🌾 <span>FarmConnect</span>
        </div>


        <nav class="sidebar-menu">


            <a href="dashboard.html" class="menu-item">
                🏠
                <span>Dashboard</span>
            </a>


            <a href="products.html" class="menu-item">
                📦
                <span>My Products</span>
            </a>


            <a href="add-product.html" class="menu-item active">
                ➕
                <span>Add Product</span>
            </a>


            <a href="orders.html" class="menu-item">
                🛒
                <span>Orders</span>
            </a>


            <a href="sales-trends.html" class="menu-item">
                💰
                <span>Sales</span>
            </a>


            <a href="sales-trends.html" class="menu-item">
                📈
                <span>Market Trends</span>
            </a>


            <a href="farmer-profile.html" class="menu-item">
                👤
                <span>Profile</span>
            </a>


        </nav>


        <div class="logout">

            <a
                href="../../index.html"
                class="menu-item"
                onclick="return confirmLogout()"
            >
                🚪
                <span>Logout</span>
            </a>

        </div>

    </aside>



    <!-- ================= MAIN CONTENT ================= -->

    <main class="main-content">

        <div class="add-product-page">


            <!-- HEADER -->

            <div class="add-product-header">

                <h1>
                    🌱 Add New Product
                </h1>

                <p>
                    List your agricultural product and connect directly
                    with potential buyers.
                </p>

            </div>



            <!-- ================= FORM ================= -->

            <div class="product-form-card">

                <form
                    id="productForm"
                    class="product-form"
                >


                    <!-- PRODUCT NAME -->

                    <div class="form-group">

                        <label for="productName">
                            Product Name <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="productName"
                            placeholder="Example: Fresh Tomatoes"
                            required
                        >

                    </div>



                    <!-- CATEGORY -->

                    <div class="form-group">

                        <label for="category">
                            Category <span>*</span>
                        </label>

                        <select
                            id="category"
                            required
                        >

                            <option value="">
                                Select Category
                            </option>

                            <option value="Vegetables">
                                🥕 Vegetables
                            </option>

                            <option value="Fruits">
                                🍎 Fruits
                            </option>

                            <option value="Grains">
                                🌾 Grains
                            </option>

                            <option value="Pulses">
                                🫘 Pulses
                            </option>

                            <option value="Spices">
                                🌶️ Spices
                            </option>

                            <option value="Other">
                                📦 Other
                            </option>

                        </select>

                    </div>



                    <!-- PRICE -->

                    <div class="form-group">

                        <label for="price">
                            Price <span>*</span>
                        </label>

                        <input
                            type="number"
                            id="price"
                            placeholder="Example: 35"
                            min="0"
                            required
                        >

                        <span class="form-help">
                            Enter the price per selected unit.
                        </span>

                    </div>



                    <!-- UNIT -->

                    <div class="form-group">

                        <label for="unit">
                            Unit <span>*</span>
                        </label>

                        <select
                            id="unit"
                            required
                        >

                            <option value="kg">
                                Kilogram (kg)
                            </option>

                            <option value="quintal">
                                Quintal
                            </option>

                            <option value="ton">
                                Ton
                            </option>

                            <option value="piece">
                                Piece
                            </option>

                            <option value="liter">
                                Liter
                            </option>

                        </select>

                    </div>



                    <!-- QUANTITY -->

                    <div class="form-group">

                        <label for="quantity">
                            Available Quantity <span>*</span>
                        </label>

                        <input
                            type="number"
                            id="quantity"
                            placeholder="Example: 100"
                            min="0"
                            required
                        >

                    </div>



                    <!-- LOCATION -->

                    <div class="form-group">

                        <label for="location">
                            Farm Location <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="location"
                            placeholder="Example: Guntur, Andhra Pradesh"
                            required
                        >

                    </div>



                    <!-- DESCRIPTION -->

                    <div class="form-group full-width">

                        <label for="description">
                            Product Description
                        </label>

                        <textarea
                            id="description"
                            placeholder="Describe your product...

Example: Freshly harvested tomatoes, naturally grown and ready for delivery."
                        ></textarea>

                    </div>



                    <!-- PRODUCT ICON -->

                    <div class="form-group full-width">

                        <label for="emoji">
                            Product Icon
                        </label>

                        <select id="emoji">

                            <option value="🌾">
                                🌾 Grain
                            </option>

                            <option value="🍅">
                                🍅 Tomato
                            </option>

                            <option value="🥭">
                                🥭 Mango
                            </option>

                            <option value="🍌">
                                🍌 Banana
                            </option>

                            <option value="🥔">
                                🥔 Potato
                            </option>

                            <option value="🌶️">
                                🌶️ Chilli
                            </option>

                            <option value="🥕">
                                🥕 Carrot
                            </option>

                        </select>

                    </div>



                    <!-- ================= BUTTONS ================= -->

                    <div class="form-actions">

                        <a
                            href="dashboard.html"
                            class="btn-cancel"
                        >
                            ← Cancel
                        </a>


                        <button
                            type="submit"
                            class="btn-submit"
                        >
                            ➕ Add Product
                        </button>

                    </div>


                </form>

            </div>

        </div>

    </main>



    <!-- ================= JAVASCRIPT ================= -->

    <script src="../../dashboard.js"></script>

    <script src="../../product.js"></script>


</body>

</html>
