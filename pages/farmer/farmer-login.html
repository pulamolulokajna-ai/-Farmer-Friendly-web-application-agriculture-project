<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Farmer Login | FarmConnect</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #e8f5e9,
                    #f1f8e9
                );

        }


        .login-container {

            width: 100%;

            max-width: 430px;

            padding: 20px;

        }


        .login-card {

            background: white;

            border-radius: 18px;

            padding: 35px;

            box-shadow:
                0 10px 35px
                rgba(
                    0,
                    0,
                    0,
                    0.12
                );

        }


        .logo {

            text-align: center;

            font-size: 32px;

            font-weight: bold;

            color: #2e7d32;

            margin-bottom: 10px;

        }


        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 30px;

        }


        .role {

            text-align: center;

            background: #e8f5e9;

            color: #2e7d32;

            padding: 10px;

            border-radius: 10px;

            margin-bottom: 25px;

            font-weight: bold;

        }


        .form-group {

            margin-bottom: 18px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: 600;

            color: #333;

        }


        input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #ddd;

            border-radius: 9px;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color: #4caf50;

        }


        .login-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #4caf50;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 8px;

        }


        .login-button:hover {

            background: #388e3c;

        }


        .create-section {

            margin-top: 25px;

            padding-top: 20px;

            border-top:
                1px solid #eee;

            text-align: center;

        }


        .create-section p {

            color: #777;

            margin-bottom: 10px;

        }


        .create-button {

            border: none;

            background: none;

            color: #2e7d32;

            font-weight: bold;

            cursor: pointer;

            font-size: 15px;

        }


        .message {

            display: none;

            padding: 10px;

            margin-bottom: 15px;

            border-radius: 8px;

            text-align: center;

            font-size: 14px;

        }


        .back-link {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #666;

            text-decoration: none;

        }


        .back-link:hover {

            color: #2e7d32;

        }


        .password-wrapper {

            position: relative;

        }


        .password-wrapper input {

            padding-right: 50px;

        }


        .show-password {

            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: none;

            cursor: pointer;

            font-size: 18px;

        }


        @media (max-width: 500px) {

            .login-card {

                padding: 25px;

            }

        }

    </style>

</head>


<body>


    <div class="login-container">


        <div class="login-card">


            <div class="logo">

                🌾 FarmConnect

            </div>


            <p class="subtitle">

                Farmer Portal

            </p>


            <div class="role">

                👨‍🌾 Farmer Login

            </div>


            <div
                id="loginMessage"
                class="message"
            ></div>


            <form
                id="farmerLoginForm"
            >


                <div class="form-group">

                    <label for="farmerEmail">

                        Email

                    </label>


                    <input
                        type="email"
                        id="farmerEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="farmerPassword">

                        Password

                    </label>


                    <div
                        class="password-wrapper"
                    >

                        <input
                            type="password"
                            id="farmerPassword"
                            placeholder="Enter your password"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword()"
                        >

                            👁️

                        </button>

                    </div>

                </div>



                <button
                    type="submit"
                    class="login-button"
                >

                    Login

                </button>


            </form>



            <div class="create-section">

                <p>
                    Don't have a farmer account?
                </p>


                <button
                    class="create-button"
                    onclick="createFarmerAccount()"
                >

                    Create Farmer Account

                </button>

            </div>



            <a
                href="../../index.html"
                class="back-link"
            >

                ← Back to FarmConnect

            </a>


        </div>


    </div>



    <script src="../../farmer-login.js"></script>


</body>

</html>
