<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Farmer Profile | FarmConnect</title>

    <link
        rel="stylesheet"
        href="../../dashboard.css"
    >

</head>


<body>


    <!-- ==============================
         SIDEBAR
    =============================== -->

    <aside class="sidebar">


        <div class="logo">

            🌾

            <span>
                FarmConnect
            </span>

        </div>


        <nav class="sidebar-menu">


            <a
                href="dashboard.html"
                class="menu-item"
            >

                🏠

                <span>
                    Dashboard
                </span>

            </a>


            <a
                href="products.html"
                class="menu-item"
            >

                📦

                <span>
                    My Products
                </span>

            </a>


            <a
                href="add-product.html"
                class="menu-item"
            >

                ➕

                <span>
                    Add Product
                </span>

            </a>


            <a
                href="orders.html"
                class="menu-item"
            >

                🛒

                <span>
                    Orders
                </span>

            </a>


            <a
                href="sales-trends.html"
                class="menu-item"
            >

                💰

                <span>
                    Sales
                </span>

            </a>


            <a
                href="sales-trends.html"
                class="menu-item"
            >

                📈

                <span>
                    Market Trends
                </span>

            </a>


            <a
                href="profile.html"
                class="menu-item active"
            >

                👤

                <span>
                    Profile
                </span>

            </a>


        </nav>


        <div class="logout">

            <a
                href="#"
                class="menu-item"
                onclick="logoutFarmer(event)"
            >

                🚪

                <span>
                    Logout
                </span>

            </a>

        </div>


    </aside>



    <!-- ==============================
         MAIN CONTENT
    =============================== -->

    <main class="main-content">


        <!-- HEADER -->

        <header class="dashboard-header">


            <div>

                <h1>
                    👤 Farmer Profile
                </h1>

                <p>
                    Manage your personal and farm information.
                </p>

            </div>


            <div class="farmer-profile">

                <div class="profile-icon">
                    👨‍🌾
                </div>


                <div>

                    <strong id="headerFarmerName">
                        Farmer
                    </strong>

                    <small>
                        Farmer
                    </small>

                </div>

            </div>


        </header>



        <!-- ==============================
             PROFILE CARD
        =============================== -->

        <section class="dashboard-card">


            <div class="card-header">

                <div>

                    <h2>
                        👨‍🌾 Personal Information
                    </h2>

                    <p>
                        Enter your farmer information below.
                    </p>

                </div>

            </div>



            <!-- MESSAGE -->

            <div
                id="profileMessage"
                style="
                    display:none;
                    margin-bottom:20px;
                    padding:12px 16px;
                    border-radius:8px;
                    background:#eef8ee;
                "
            ></div>



            <!-- FORM -->

            <form
                id="farmerProfileForm"
            >


                <!-- NAME -->

                <div
                    style="
                        margin-bottom:20px;
                    "
                >

                    <label
                        for="farmerName"
                        style="
                            display:block;
                            margin-bottom:8px;
                            font-weight:600;
                        "
                    >
                        Full Name
                    </label>


                    <input
                        type="text"
                        id="farmerName"
                        placeholder="Enter your full name"
                        required
                        style="
                            width:100%;
                            padding:12px;
                            border:1px solid #ddd;
                            border-radius:8px;
                            box-sizing:border-box;
                        "
                    >

                </div>



                <!-- EMAIL -->

                <div
                    style="
                        margin-bottom:20px;
                    "
                >

                    <label
                        for="farmerEmail"
                        style="
                            display:block;
                            margin-bottom:8px;
                            font-weight:600;
                        "
                    >
                        Email
                    </label>


                    <input
                        type="email"
                        id="farmerEmail"
                        placeholder="Enter your email"
                        required
                        style="
                            width:100%;
                            padding:12px;
                            border:1px solid #ddd;
                            border-radius:8px;
                            box-sizing:border-box;
                        "
                    >

                </div>



                <!-- PHONE -->

                <div
                    style="
                        margin-bottom:20px;
                    "
                >

                    <label
                        for="farmerPhone"
                        style="
                            display:block;
                            margin-bottom:8px;
                            font-weight:600;
                        "
                    >
                        Phone Number
                    </label>


                    <input
                        type="tel"
                        id="farmerPhone"
                        placeholder="Enter your phone number"
                        required
                        style="
                            width:100%;
                            padding:12px;
                            border:1px solid #ddd;
                            border-radius:8px;
                            box-sizing:border-box;
                        "
                    >

                </div>



                <!-- FARM NAME -->

                <div
                    style="
                        margin-bottom:20px;
                    "
                >

                    <label
                        for="farmName"
                        style="
                            display:block;
                            margin-bottom:8px;
                            font-weight:600;
                        "
                    >
                        Farm Name
                    </label>


                    <input
                        type="text"
                        id="farmName"
                        placeholder="Enter your farm name"
                        style="
                            width:100%;
                            padding:12px;
                            border:1px solid #ddd;
                            border-radius:8px;
                            box-sizing:border-box;
                        "
                    >

                </div>



                <!-- LOCATION -->

                <div
                    style="
                        margin-bottom:20px;
                    "
                >

                    <label
                        for="farmLocation"
                        style="
                            display:block;
                            margin-bottom:8px;
                            font-weight:600;
                        "
                    >
                        Farm Location
                    </label>


                    <input
                        type="text"
                        id="farmLocation"
                        placeholder="Enter your farm location"
                        style="
                            width:100%;
                            padding:12px;
                            border:1px solid #ddd;
                            border-radius:8px;
                            box-sizing:border-box;
                        "
                    >

                </div>



                <!-- STATE -->

                <div
                    style="
                        margin-bottom:20px;
                    "
                >

                    <label
                        for="farmerState"
                        style="
                            display:block;
                            margin-bottom:8px;
                            font-weight:600;
                        "
                    >
                        State
                    </label>


                    <input
                        type="text"
                        id="farmerState"
                        placeholder="Enter your state"
                        style="
                            width:100%;
                            padding:12px;
                            border:1px solid #ddd;
                            border-radius:8px;
                            box-sizing:border-box;
                        "
                    >

                </div>



                <!-- PINCODE -->

                <div
                    style="
                        margin-bottom:20px;
                    "
                >

                    <label
                        for="farmerPincode"
                        style="
                            display:block;
                            margin-bottom:8px;
                            font-weight:600;
                        "
                    >
                        Pincode
                    </label>


                    <input
                        type="text"
                        id="farmerPincode"
                        placeholder="Enter your pincode"
                        style="
                            width:100%;
                            padding:12px;
                            border:1px solid #ddd;
                            border-radius:8px;
                            box-sizing:border-box;
                        "
                    >

                </div>



                <!-- ADDRESS -->

                <div
                    style="
                        margin-bottom:20px;
                    "
                >

                    <label
                        for="farmerAddress"
                        style="
                            display:block;
                            margin-bottom:8px;
                            font-weight:600;
                        "
                    >
                        Address
                    </label>


                    <textarea
                        id="farmerAddress"
                        rows="4"
                        placeholder="Enter your complete address"
                        style="
                            width:100%;
                            padding:12px;
                            border:1px solid #ddd;
                            border-radius:8px;
                            box-sizing:border-box;
                            resize:vertical;
                        "
                    ></textarea>

                </div>



                <!-- BUTTONS -->

                <div
                    style="
                        display:flex;
                        gap:12px;
                        flex-wrap:wrap;
                    "
                >


                    <button
                        type="submit"
                        style="
                            padding:12px 22px;
                            border:none;
                            border-radius:8px;
                            cursor:pointer;
                            font-weight:600;
                        "
                    >

                        💾 Save Profile

                    </button>



                    <button
                        type="button"
                        onclick="clearFarmerProfile()"
                        style="
                            padding:12px 22px;
                            border:none;
                            border-radius:8px;
                            cursor:pointer;
                            font-weight:600;
                        "
                    >

                        🗑️ Clear Profile

                    </button>


                </div>


            </form>


        </section>



    </main>



    <!-- JAVASCRIPT -->

    <script src="profile.js"></script>


</body>

</html>
